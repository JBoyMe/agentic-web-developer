services:
  credits:
    build:
      # One image definition for Render and Compose alike: the Dockerfile at the
      # repo root, with the repo root as context.
      context: ../..
      dockerfile: Dockerfile
    container_name: awd-credits
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - credits-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  credits-data:
